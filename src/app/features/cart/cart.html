<h2>購物車</h2>
@for (item of cartService.items(); track item.product.id) {
    <p>{{item.product.name}}</p>
    <p>數量：{{item.quantity}}</p>
    <p>小計：{{item.quantity * item.product.price| price}}</p>
    <button type="button" [disabled]="item.quantity <= 1"
        (click)="cartService.updateQuantity(item.product.id, item.quantity - 1)">
        減少
    </button>
    <button type="button" [disabled]="item.quantity >= item.product.stock"
        (click)="cartService.updateQuantity(item.product.id, item.quantity + 1)">
        增加
    </button>
    <button type="button" (click)="cartService.removeItem(item.product.id)">刪除</button>
}
@empty {
    <p>購物車目前是空的</p>
}
